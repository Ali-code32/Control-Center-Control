<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APEX CONTROL</title>

<script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-database-compat.js"></script>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:radial-gradient(circle at top,#1d0909 0%,#080808 24%,#050505 65%,#000 100%);
color:white;
font-family:Arial,sans-serif;
min-height:100vh
}

header{
padding:28px 30px 22px;
border-bottom:1px solid rgba(255,70,70,.2);
background:linear-gradient(180deg,rgba(24,0,0,.9),rgba(10,10,10,.93));
box-shadow:0 0 35px rgba(255,0,0,.08)
}

.header-title{
font-size:32px;
font-weight:900;
letter-spacing:7px;
color:#ff3b3b;
text-shadow:0 0 25px rgba(255,50,50,.45)
}

.header-sub{
margin-top:8px;
color:#a6a6a6;
font-size:12px;
letter-spacing:4px;
text-transform:uppercase
}

.status{
display:flex;
align-items:center;
gap:10px;
margin-top:18px;
font-size:12px;
color:#d6d6d6;
letter-spacing:2px;
text-transform:uppercase
}

.status-dot{
width:12px;
height:12px;
border-radius:50%;
background:#777;
box-shadow:0 0 10px rgba(255,255,255,.12)
}

.status-dot.online{
background:#00ff66;
box-shadow:0 0 15px #00ff66
}

.status-dot.offline{
background:#ff2020;
box-shadow:0 0 15px #ff2020
}

.container{
max-width:1200px;
margin:auto;
padding:30px
}

.timer-box{
text-align:center;
background:linear-gradient(180deg,#110909,#090909);
border:1px solid rgba(255,80,80,.25);
box-shadow:inset 0 0 30px rgba(255,0,0,.06),0 0 30px rgba(255,0,0,.06);
padding:35px;
margin-bottom:25px
}

.timer-label{
font-size:11px;
letter-spacing:6px;
color:#d5d5d5;
text-transform:uppercase
}

.timer{
font-size:90px;
font-weight:900;
letter-spacing:8px;
margin-top:10px;
color:#f2f2f2;
text-shadow:0 0 22px rgba(255,255,255,.15)
}

.timer.warning{
color:#ff2020;
text-shadow:0 0 30px rgba(255,40,40,.9),0 0 60px rgba(255,40,40,.5);
animation:timerPulse .7s infinite
}

@keyframes timerPulse{
50%{opacity:.4}
}

.controls{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px
}

button{
border:1px solid rgba(255,255,255,.12);
background:linear-gradient(180deg,#171717,#0b0b0b);
color:white;
padding:18px 10px;
font-weight:700;
letter-spacing:2px;
cursor:pointer;
transition:.2s;
text-transform:uppercase
}

button:hover{
background:linear-gradient(180deg,#292929,#141414);
border-color:rgba(255,255,255,.4);
box-shadow:0 0 18px rgba(255,80,80,.08)
}

button:active{
transform:scale(.97)
}

.start{
border-color:rgba(0,255,102,.7);
color:#7effac;
box-shadow:inset 0 0 18px rgba(0,255,102,.08)
}

.pause{
border-color:rgba(255,170,0,.8);
color:#ffbf55;
box-shadow:inset 0 0 18px rgba(255,170,0,.08)
}

.kill{
grid-column:span 2;
background:linear-gradient(180deg,#430505,#260202);
border:2px solid rgba(255,40,40,.9);
color:#ff4d4d;
font-size:20px;
padding:25px;
box-shadow:0 0 30px rgba(255,0,0,.15)
}

.kill:hover{
background:linear-gradient(180deg,#ff2020,#9a0505);
color:#fff;
box-shadow:0 0 35px rgba(255,0,0,.6)
}

.failure{
color:#ff2020;
border-color:#ff2020
}

.info{
margin-top:25px;
display:grid;
grid-template-columns:1fr 1fr;
gap:20px
}

.panel{
background:linear-gradient(180deg,#0f0f0f,#080808);
border:1px solid rgba(255,80,80,.2);
box-shadow:inset 0 0 22px rgba(255,0,0,.04);
padding:20px
}

.panel-title{
color:#a9a9a9;
font-size:10px;
letter-spacing:4px;
margin-bottom:10px;
text-transform:uppercase
}

.panel-value{
font-size:20px;
font-weight:700;
color:#f3f3f3;
text-shadow:0 0 12px rgba(255,60,60,.15)
}

.log{
margin-top:25px;
background:#030303;
border:1px solid #222;
height:180px;
overflow-y:auto;
padding:15px;
font-family:monospace;
font-size:12px
}

.log-entry{
margin-bottom:7px;
color:#777
}

.log-entry span{
color:#ff2020
}

@media(max-width:700px){
.controls{
grid-template-columns:repeat(2,1fr)
}

.timer{
font-size:55px
}

.info{
grid-template-columns:1fr
}
}
</style>
</head>

<body>

<header>
<div class="header-title">APEX CONTROL</div>
<div class="header-sub">BIG TECH INDUSTRIES // ROOM 04 // OPERATOR TERMINAL</div>

<div class="status">
<div class="status-dot" id="statusDot"></div>
<span id="statusText">CONNECTING TO APEX...</span>
</div>
</header>

<div class="container">

<div class="timer-box">
<div class="timer-label">APEX CONTAINMENT TIMER</div>
<div class="timer" id="timer">07:00</div>
</div>

<div class="controls">

<button class="start" onclick="startTimer()">START</button>
<button class="pause" onclick="pauseTimer()">PAUSE</button>
<button onclick="resetSystem()">RESET</button>
<button onclick="sendCommand('WELCOME')">WELCOME</button>

<button onclick="sendCommand('WATCHING')">WATCHING</button>
<button onclick="sendCommand('WARNING')">WARNING</button>
<button onclick="sendCommand('GLITCH')">GLITCH</button>
<button onclick="sendCommand('PANIC')">PANIC</button>

<button onclick="sendCommand('LAST_MINUTE')">LAST MINUTE</button>
<button onclick="sendCommand('COUNTDOWN')">COUNTDOWN</button>
<button class="failure" onclick="sendCommand('FAILURE')">FAILURE</button>

<button class="kill" onclick="killSwitch()">ACTIVATE KILL SWITCH</button>

</div>

<div class="info">

<div class="panel">
<div class="panel-title">CURRENT COMMAND</div>
<div class="panel-value" id="command">STANDBY</div>
</div>

<div class="panel">
<div class="panel-title">SYSTEM STATUS</div>
<div class="panel-value" id="systemStatus">STANDBY</div>
</div>

</div>

<div class="log" id="log"></div>

</div>

<script>

const firebaseConfig={
apiKey:"AIzaSyDglN0kUgxnMfHiin5lZaH44IFxff54z5M",
authDomain:"escape-rooms-control.firebaseapp.com",
databaseURL:"https://escape-rooms-control-default-rtdb.firebaseio.com",
projectId:"escape-rooms-control",
storageBucket:"escape-rooms-control.firebasestorage.app",
messagingSenderId:"288209457856",
appId:"1:288209457856:web:e8b0b9a429149754ec5325"
};

firebase.initializeApp(firebaseConfig);

const database=firebase.database();

const commandRef=database.ref("apex/command");
const timerRef=database.ref("apex/timer");
const statusRef=database.ref("apex/status");
const timestampRef=database.ref("apex/timestamp");

let timeLeft=420;
let timerRunning=false;
let timerInterval=null;

const timerDisplay=document.getElementById("timer");
const commandDisplay=document.getElementById("command");
const systemStatus=document.getElementById("systemStatus");
const statusDot=document.getElementById("statusDot");
const statusText=document.getElementById("statusText");
const log=document.getElementById("log");

function addLog(message){
const entry=document.createElement("div");
entry.className="log-entry";
const time=new Date().toLocaleTimeString();
entry.innerHTML=`[${time}] <span>${message}</span>`;
log.prepend(entry);
}

function updateTimerDisplay(){

const minutes=Math.floor(timeLeft/60);
const seconds=timeLeft%60;

timerDisplay.textContent=
String(minutes).padStart(2,"0")+":"+
String(seconds).padStart(2,"0");

if(timeLeft<=60){
timerDisplay.classList.add("warning");
}else{
timerDisplay.classList.remove("warning");
}
}

async function sendCommand(command){

commandDisplay.textContent=command;
systemStatus.textContent=command;

await commandRef.set(command);
await timestampRef.set(Date.now());

addLog("COMMAND SENT: "+command);
}

window.sendCommand=sendCommand;

async function startTimer(){

if(timerRunning)return;

timerRunning=true;

await statusRef.set("RUNNING");

await sendCommand("START");

timerInterval=setInterval(async()=>{

if(!timerRunning)return;

timeLeft--;

updateTimerDisplay();

await timerRef.set(timeLeft);

if(timeLeft===60){
await sendCommand("LAST_MINUTE");
}

if(timeLeft===30){
await sendCommand("PANIC");
}

if(timeLeft===10){
await sendCommand("COUNTDOWN");
}

if(timeLeft<=0){

clearInterval(timerInterval);
timerRunning=false;

await statusRef.set("FAILED");

await sendCommand("FAILURE");
}

},1000);

addLog("TIMER STARTED");
}

window.startTimer=startTimer;

async function pauseTimer(){

timerRunning=false;
clearInterval(timerInterval);

await statusRef.set("PAUSED");
await sendCommand("PAUSED");

addLog("TIMER PAUSED");
}

window.pauseTimer=pauseTimer;

async function resetSystem(){

timerRunning=false;
clearInterval(timerInterval);

timeLeft=420;

updateTimerDisplay();

await timerRef.set(420);
await statusRef.set("STANDBY");
await commandRef.set("RESET");
await timestampRef.set(Date.now());

commandDisplay.textContent="RESET";
systemStatus.textContent="STANDBY";

addLog("SYSTEM RESET");
}

window.resetSystem=resetSystem;

async function killSwitch(){

timerRunning=false;
clearInterval(timerInterval);

await statusRef.set("KILLSWITCH");
await commandRef.set("KILLSWITCH");
await timestampRef.set(Date.now());

commandDisplay.textContent="KILLSWITCH";
systemStatus.textContent="APEX TERMINATION";

addLog("KILLSWITCH ACTIVATED");
}

window.killSwitch=killSwitch;

commandRef.on("value",snapshot=>{
const value=snapshot.val();
if(value){
commandDisplay.textContent=value;
}
});

timerRef.on("value",snapshot=>{
const value=snapshot.val();

if(typeof value==="number"){
timeLeft=value;
updateTimerDisplay();
}
});

statusRef.on("value",snapshot=>{
const value=snapshot.val();

if(value){
systemStatus.textContent=value;
}
});

database.ref(".info/connected").on("value",snapshot=>{

if(snapshot.val()===true){

statusDot.classList.add("online");
statusDot.classList.remove("offline");
statusText.textContent="APEX DATABASE CONNECTED";

addLog("DATABASE CONNECTION ESTABLISHED");

}else{

statusDot.classList.remove("online");
statusDot.classList.add("offline");
statusText.textContent="DATABASE OFFLINE";
}
});

updateTimerDisplay();

</script>

</body>
</html>
